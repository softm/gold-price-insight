plugins {
    id "com.android.application"
}

def releaseSigning = new Properties()
def signingFile = rootProject.file("signing.properties")
if (signingFile.exists()) {
    signingFile.withInputStream { releaseSigning.load(it) }
}

android {
    namespace "com.softm.goldsignal"
    compileSdk 36

    defaultConfig {
        applicationId "com.softm.goldsignal"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        release {
            if (signingFile.exists()) {
                storeFile rootProject.file(releaseSigning.getProperty("storeFile"))
                storePassword releaseSigning.getProperty("storePassword")
                keyAlias releaseSigning.getProperty("keyAlias")
                keyPassword releaseSigning.getProperty("keyPassword")
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    sourceSets {
        main.assets.srcDirs = [layout.buildDirectory.dir("generated/web-assets").get().asFile]
    }
}

tasks.register("syncWebAssets", Sync) {
    from rootProject.file("../dist")
    into layout.buildDirectory.dir("generated/web-assets")
    exclude "404.html"
}

tasks.named("preBuild").configure {
    dependsOn tasks.named("syncWebAssets")
}

tasks.configureEach { task ->
    if (task.name == "validateSigningRelease") {
        task.doFirst {
            if (!signingFile.exists()) throw new GradleException("signing.properties 파일이 필요합니다.")
            ["storeFile", "storePassword", "keyAlias", "keyPassword"].each { key ->
                if (!releaseSigning.getProperty(key)) throw new GradleException("서명 설정 누락: " + key)
            }
        }
    }
}
